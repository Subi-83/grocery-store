apiVersion: v1
kind: ConfigMap
metadata: { name: grocery-config, namespace: grocery }
data:
  DB_HOST: mysql
  DB_NAME: grocery
  DB_USER: grocery
---
# Demo values only. For anything real, create this with `kubectl create secret` instead of committing it.
apiVersion: v1
kind: Secret
metadata: { name: grocery-secret, namespace: grocery }
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpass123
  DB_PASSWORD: grocerypass123
  JWT_SECRET: change-this-long-random-string
